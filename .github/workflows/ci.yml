name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://cargogrid:cargogrid@127.0.0.1:5432/cargogrid?schema=public
      JWT_SECRET: ci-only-secret-not-for-production-use
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cargogrid
          POSTGRES_PASSWORD: cargogrid
          POSTGRES_DB: cargogrid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cargogrid -d cargogrid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm run build
      - run: pnpm exec prisma migrate deploy
      - name: Unit tests
        run: pnpm test
      - name: e2e tests
        run: pnpm run test:e2e
        env:
          NODE_OPTIONS: --experimental-vm-modules
